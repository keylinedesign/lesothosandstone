<!-- @dsCard group="Website" viewport="1440x900" name="Lesotho Stone website" subtitle="Dark redesign — all 10 pages, click-through" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesotho Stone – Leaders in Sandstone</title>
<link rel="stylesheet" href="../../styles.css">
<style>
@keyframes lsMarquee{to{transform:translateX(-50%)}}
@keyframes lsWord{from{transform:translateY(105%)}to{transform:none}}
@keyframes lsFade{from{opacity:0}to{opacity:1}}
.ls-marquee{animation:lsMarquee 40s linear infinite}
.ls-word{animation:lsWord 1.1s cubic-bezier(.16,1,.3,1) both}
@media (prefers-reduced-motion:reduce){.ls-marquee,.ls-word{animation:none}}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
</head><body><div id="root"></div>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="ProjectsPage.jsx"></script>
<script type="text/babel" src="HomePage.jsx"></script>
<script type="text/babel" src="ProductsPages.jsx"></script>
<script type="text/babel" src="InfoPages.jsx"></script>
<script type="text/babel">
function App(){
  const {SiteNav}=LSN;
  const [route,setRoute]=React.useState(()=>localStorage.getItem('ls-route')||'home');
  const [solid,setSolid]=React.useState(false);
  React.useEffect(()=>{const s=()=>setSolid(window.scrollY>40);window.addEventListener('scroll',s);s();return()=>window.removeEventListener('scroll',s)},[]);
  const go=r=>{setRoute(r);localStorage.setItem('ls-route',r);window.scrollTo({top:0})};
  let page,cur=route;
  if(route.startsWith('product:')){const [,c,n]=route.split(':');page=<ProductPage cat={c} name={n} go={go}/>;cur=c;}
  else page={home:<HomePage go={go}/>,about:<AboutPage go={go}/>,products:<ProductsOverview go={go}/>,custom:<CategoryPage id="custom" go={go}/>,bricks:<CategoryPage id="bricks" go={go}/>,cladding:<CategoryPage id="cladding" go={go}/>,projects:<ProjectsPage go={go}/>,production:<ProductionPage go={go}/>,distribution:<DistributionPage go={go}/>,contact:<ContactPage go={go}/>}[route]||<HomePage go={go}/>;
  return <><SiteNav current={cur} onNavigate={go} logoSrc="../../assets/logo-lesotho-stone.jpeg" solid={solid}/><main key={route}>{page}</main><SiteFooter go={go}/></>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
