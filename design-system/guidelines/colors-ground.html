<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;margin:0}.lb{font:500 10px/1.3 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}.v{font:400 11px var(--font-mono);color:var(--text-subtle)}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px"><div style="display:grid;gap:6px"><div style="height:90px;background:var(--basalt-900);border:1px solid var(--line-hairline)"></div><div class="lb" style="color:var(--text-strong)">900 sunken</div><div class="v">--basalt-900</div></div><div style="display:grid;gap:6px"><div style="height:90px;background:var(--basalt-800);border:1px solid var(--line-hairline)"></div><div class="lb" style="color:var(--text-strong)">800 page</div><div class="v">--basalt-800</div></div><div style="display:grid;gap:6px"><div style="height:90px;background:var(--basalt-700);border:1px solid var(--line-hairline)"></div><div class="lb" style="color:var(--text-strong)">700 card</div><div class="v">--basalt-700</div></div><div style="display:grid;gap:6px"><div style="height:90px;background:var(--basalt-600);border:1px solid var(--line-hairline)"></div><div class="lb" style="color:var(--text-strong)">600</div><div class="v">--basalt-600</div></div><div style="display:grid;gap:6px"><div style="height:90px;background:var(--basalt-500);border:1px solid var(--line-hairline)"></div><div class="lb" style="color:var(--text-strong)">500</div><div class="v">--basalt-500</div></div></div></body></html>
