<!-- @dsCard group="Colors" viewport="700x160" name="Semantic surfaces" subtitle="Page, card, accent, inverse, earth" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;margin:0}.lb{font:500 10px/1.3 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}.v{font:400 11px var(--font-mono);color:var(--text-subtle)}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px"><div style="display:grid;gap:6px"><div style="height:90px;background:var(--surface-page);border:1px solid var(--line-hairline)"></div><div class="lb" style="color:var(--text-strong)">Page</div><div class="v">--surface-page</div></div><div style="display:grid;gap:6px"><div style="height:90px;background:var(--surface-card);border:1px solid var(--line-hairline)"></div><div class="lb" style="color:var(--text-strong)">Card</div><div class="v">--surface-card</div></div><div style="display:grid;gap:6px"><div style="height:90px;background:var(--surface-accent);border:1px solid var(--line-hairline)"></div><div class="lb" style="color:var(--text-strong)">Accent</div><div class="v">--surface-accent</div></div><div style="display:grid;gap:6px"><div style="height:90px;background:var(--surface-inverse);border:1px solid var(--line-hairline)"></div><div class="lb" style="color:var(--text-strong)">Inverse</div><div class="v">--surface-inverse</div></div><div style="display:grid;gap:6px"><div style="height:90px;background:var(--surface-earth);border:1px solid var(--line-hairline)"></div><div class="lb" style="color:var(--text-strong)">Earth</div><div class="v">--surface-earth</div></div></div></body></html>
