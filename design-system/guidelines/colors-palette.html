<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;margin:0}.lb{font:500 10px/1.3 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}.v{font:400 11px var(--font-mono);color:var(--text-subtle)}</style></head><body><div style="display:grid;grid-template-columns:repeat(10,1fr);gap:8px"><div style="display:grid;gap:6px"><div style="height:80px;background:var(--chalk);border:1px solid var(--line-hairline)"></div><div class="lb" style="color:var(--text-strong)">Chalk</div><div class="v">--chalk</div></div><div style="display:grid;gap:6px"><div style="height:80px;background:var(--basalt);border:1px solid var(--line-hairline)"></div><div class="lb" style="color:var(--text-strong)">Basalt</div><div class="v">--basalt</div></div><div style="display:grid;gap:6px"><div style="height:80px;background:var(--ash);border:1px solid var(--line-hairline)"></div><div class="lb" style="color:var(--text-strong)">Ash</div><div class="v">--ash</div></div><div style="display:grid;gap:6px"><div style="height:80px;background:var(--pumice);border:1px solid var(--line-hairline)"></div><div class="lb" style="color:var(--text-strong)">Pumice</div><div class="v">--pumice</div></div><div style="display:grid;gap:6px"><div style="height:80px;background:var(--sandstone);border:1px solid var(--line-hairline)"></div><div class="lb" style="color:var(--text-strong)">Sandstone</div><div class="v">--sandstone</div></div><div style="display:grid;gap:6px"><div style="height:80px;background:var(--umber);border:1px solid var(--line-hairline)"></div><div class="lb" style="color:var(--text-strong)">Umber</div><div class="v">--umber</div></div><div style="display:grid;gap:6px"><div style="height:80px;background:var(--clay);border:1px solid var(--line-hairline)"></div><div class="lb" style="color:var(--text-strong)">Clay</div><div class="v">--clay</div></div><div style="display:grid;gap:6px"><div style="height:80px;background:var(--dune);border:1px solid var(--line-hairline)"></div><div class="lb" style="color:var(--text-strong)">Dune</div><div class="v">--dune</div></div><div style="display:grid;gap:6px"><div style="height:80px;background:var(--slate);border:1px solid var(--line-hairline)"></div><div class="lb" style="color:var(--text-strong)">Slate</div><div class="v">--slate</div></div><div style="display:grid;gap:6px"><div style="height:80px;background:var(--earth);border:1px solid var(--line-hairline)"></div><div class="lb" style="color:var(--text-strong)">Earth</div><div class="v">--earth</div></div></div></body></html>
