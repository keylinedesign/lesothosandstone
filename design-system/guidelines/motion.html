<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;margin:0}.lb{font:500 10px/1.3 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}.v{font:400 11px var(--font-mono);color:var(--text-subtle)}@keyframes g{from{width:0}to{width:100%}}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px"><div style="border-top:1px solid var(--line-strong);padding-top:12px"><div class="ls-display" style="font-size:36px">180ms</div><div class="lb" style="margin-top:6px">Fast · hover colour</div><div class="v">--dur-fast</div><div style="margin-top:12px;height:4px;background:var(--basalt-600);overflow:hidden"><div class="bar" style="height:100%;background:var(--dune);animation:g 180ms var(--ease-out) 0ms infinite alternate"></div></div></div><div style="border-top:1px solid var(--line-strong);padding-top:12px"><div class="ls-display" style="font-size:36px">420ms</div><div class="lb" style="margin-top:6px">Base · scrim, arrows</div><div class="v">--dur-base</div><div style="margin-top:12px;height:4px;background:var(--basalt-600);overflow:hidden"><div class="bar" style="height:100%;background:var(--dune);animation:g 420ms var(--ease-out) 200ms infinite alternate"></div></div></div><div style="border-top:1px solid var(--line-strong);padding-top:12px"><div class="ls-display" style="font-size:36px">900ms</div><div class="lb" style="margin-top:6px">Slow · image zoom</div><div class="v">--dur-slow</div><div style="margin-top:12px;height:4px;background:var(--basalt-600);overflow:hidden"><div class="bar" style="height:100%;background:var(--dune);animation:g 900ms var(--ease-out) 400ms infinite alternate"></div></div></div><div style="border-top:1px solid var(--line-strong);padding-top:12px"><div class="ls-display" style="font-size:36px">1200ms</div><div class="lb" style="margin-top:6px">Reveal · scroll-in</div><div class="v">--dur-reveal</div><div style="margin-top:12px;height:4px;background:var(--basalt-600);overflow:hidden"><div class="bar" style="height:100%;background:var(--dune);animation:g 1200ms var(--ease-out) 600ms infinite alternate"></div></div></div></div><div class="v" style="margin-top:14px">--ease-out cubic-bezier(.16,1,.3,1)</div></body></html>
